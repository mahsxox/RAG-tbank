services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: tbank-rag:latest
    container_name: rag_app
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      AUTO_INDEX: "1"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - models:/models
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  models:
